apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: workshop-samer
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
      - name: frontend
        image: ghcr.io/samerrazzaqh/coursdevops/frontend:latest
        imagePullPolicy: Always 
        env: 
          - name: BACKEND_URL
            value: "http://backend-service:80"
          - name: API_URL
            value: "https://samer-kubernetes.infra-x.cloud"
         
        ports:
        - containerPort: 80