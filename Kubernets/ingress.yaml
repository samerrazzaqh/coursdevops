apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  name: samer-form-ingress
  namespace: workshop-samer
spec:
  ingressClassName: nginx
  rules:
  - host: samer-kubernetes.infra-x.cloud
    http:
      paths:
      - backend:
          service:
            name: frontend-service
            port:
              number: 80
        path: /
        pathType: Prefix
      - backend:
          service:
            name: backend-service
            port:
              number: 80
        path: /api
        pathType: Prefix
      - backend:
          service:
            name: backend-service
            port:
              number: 80
        path: /actuator
        pathType: Prefix
  tls:
  - hosts:
    - samer-kubernetes.infra-x.cloud
    secretName: samer-form-tls

  