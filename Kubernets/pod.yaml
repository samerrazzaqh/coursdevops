apiVersion: v1
kind: Pod
metadata:
  name: nginx
  namespace: workshop-samer
spec:
  containers:
  - name: nginx
    image: nginx
    ports:
    - containerPort: 80

  - name: nginx-c1
    image: busybox
    command:
      - sleep
      - "3600"

  - name: mysql
    image: mysql
    env: 
      - name: MYSQL_ROOT_PASSWORD
        value: "test"