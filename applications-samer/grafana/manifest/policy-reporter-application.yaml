apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: policy-reporter
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://kyverno.github.io/policy-reporter
    chart: policy-reporter
    targetRevision: 3.11.2
    helm:
      values: |
        metrics:
          enabled: true
          serviceMonitor:
            enabled: true
            namespace: monitoring-samer
            labels:
              release: prometheus
        ui:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring-samer
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true