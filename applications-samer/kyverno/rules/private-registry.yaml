apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: deny-public-registries
  namespace: kyverno-samer
spec:
  validationFailureAction: enforce
  rules:
    - name: deny-public-registries
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "Unknown image registry"
        pattern:
          spec:
            containers:
              - image: "codecloud.io/*"