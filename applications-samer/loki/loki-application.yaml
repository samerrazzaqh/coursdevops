apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
spec:
  project: default
  source:
    chart: loki
    repoURL: https://prometheus-community.github.io/helm-charts
    targetRevision: 19.0.3  # <-- الإصدار الصحيح المحدث من ArtifactHub
    helm:
      values: |
        ingress:
          enabled: true
          ingressClassName: nginx
          hosts:
            - loki.infra-v.cloud
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring-samer
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true