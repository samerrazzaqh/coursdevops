apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
spec:
  project: default
  source:
    chart: loki
    repoURL: https://grafana-community.github.io/helm-charts/
    targetRevision: 19.0.3 
    helm:
      values: |
        ingress:
          enabled: true
          ingressClassName: nginx
          hosts:
            - loki.infra-v.cloud
        
        loki:
          useTestSchema: true
          auth_enabled: false
          storage:
            type: filesystem
            filesystem:
              chunks_directory: /var/loki/chunks
              rules_directory: /var/loki/rules

        deploymentMode: SingleBinary
        singleBinary:
          replicas: 1

        backend:
          replicas: 0
        read:
          replicas: 0
        write:
          replicas: 0
        
        compactor:
          enabled: false

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring-samer
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true