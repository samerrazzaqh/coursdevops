apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
spec:
  project: default
  source:
    chart: loki
    repoURL: https://grafana-community.github.io/helm-charts/
    targetRevision: 19.0.3 
    helm:
      values: |
        ingress:
          enabled: true
          ingressClassName: nginx
          hosts:
            - loki.infra-v.cloud
        
        loki:
          auth_enabled: false
          storage:
            type: filesystem
            filesystem:
              chunks_directory: /var/loki/chunks
              rules_directory: /var/loki/rules
          schema_config:
            configs:
              - from: 2024-04-01
                store: tsdb
                object_store: filesystem
                schema: v13
                index:
                  prefix: index_
                  period: 24h
        
        compactor:
          shared_store: filesystem
          retention_enabled: false

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring-samer
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true