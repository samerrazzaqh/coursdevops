apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
spec:
  project: default
  source:
    chart: prometheus
    repoURL: https://prometheus-community.github.io/helm-charts
    targetRevision: 29.37.0
    helm:
      values: |
        server:
          ingress:
            enabled: true
            ingressClassName: nginx
            hosts:
              - prometheus.infra-v.cloud
        extraScrapeConfigs: |
          - job_name: 'policy-reporter'
            static_configs:
              - targets: ['policy-reporter.monitoring-samer.svc.cluster.local:8080']
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring-samer
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true