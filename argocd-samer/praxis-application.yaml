apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: praxis-form-samer
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/samerrazzaqh/coursdevops.git
    targetRevision: main
    path: samer-chart 
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: workshop-samer
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
