apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: praxis-gateway
  namespace: workshop-samer
spec:
  gatewayClassName: nginx
  listeners: 
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https-app
      protocol: HTTPS
      port: 443
      hostname: "samer-kubernetes.infra-x.cloud"
      allowedRoutes:
        namespaces:
          from: Same

      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: samer-form-tls
    