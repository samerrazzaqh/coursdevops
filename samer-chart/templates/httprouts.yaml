apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: praxis-httproute
spec:
  parentRefs:
    - name: praxis-gateway
  hostnames:
    - "samer-kubernetes.infra-x.cloud"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
        backendRefs:
        - name: frontend-service
        port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /api
        backendRefs:
        - name: backend-service
        port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /actuator
        backendRefs:
        - name: backend-service
        port: 80